[project]
name = "jllm-bot-system"
version = "0.1.0"
description = "DeepSeek Harness の設計思想を取り入れた、プラグイン型 Discord Bot"
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "kuraneko1" }]
dependencies = [
    "PyYAML>=6.0.3,<7",
    "jsonschema>=4.25,<5",
]

[project.scripts]
jllm = "jllm_voice.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jllm_voice"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
