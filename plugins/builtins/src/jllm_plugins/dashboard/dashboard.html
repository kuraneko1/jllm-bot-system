<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta id="themeColorMeta" name="theme-color" content="#101216">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>jllm voice</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="alternate icon" href="/favicon.ico">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <script>try{var t=localStorage.getItem("jllmTheme");document.documentElement.dataset.theme=t==="light"?"light":"dark";}catch(_){document.documentElement.dataset.theme="dark";}</script>
  <link rel="stylesheet" href="/static/app.css?v={{ASSET_V}}">
</head>
<body data-admin="false" data-asset-v="{{ASSET_V}}">
  <header class="topbar shell">
    <button id="navToggle" class="nav-toggle" type="button" aria-label="メニューを開く" aria-expanded="false" aria-controls="navDrawer">
      <svg class="icon" viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M3 5.5h14M3 10h14M3 14.5h14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
    </button>
    <div class="desktop-brand">
      <a class="brand" href="/" aria-label="jllm voice ホーム">
        <span class="brand-mark"><svg viewBox="0 0 40 40" fill="none" aria-hidden="true"><path d="M3 18v5M11 10v20M20 4v32M29 12v16M37 17v7" stroke="currentColor" stroke-width="3.2" stroke-linecap="round"/></svg></span>
        <span>jllm voice</span>
      </a>
    </div>
    <span class="topbar-brand">jllm voice</span>
    <div id="topActions" class="top-actions">
      <span id="accessStatus" class="status">閲覧モード</span>
      <button id="themeToggle" class="button ghost small theme-toggle" type="button" aria-label="ライト／ダークモードを切り替え"></button>
      <a id="htmlDashboardLink" class="button ghost small" data-url="{{VIEWER_URL}}" target="_blank" rel="noopener" hidden>HTMLダッシュボード</a>
      <button id="loginButton" class="button ghost small" type="button">管理者ログイン</button>
      <button id="logoutButton" class="button secondary small admin-only" type="button">ログアウト</button>
    </div>
  </header>

  <div id="navBackdrop" class="nav-backdrop"></div>
  <aside id="navDrawer" class="nav-drawer" aria-label="メニュー">
    <div class="drawer-head">
      <span>jllm voice</span>
      <button id="navClose" class="drawer-close" type="button" aria-label="メニューを閉じる">
        <svg class="icon" viewBox="0 0 20 20" width="16" height="16" aria-hidden="true"><path d="M5 5l10 10M15 5L5 15" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="drawer-body">
      <div class="drawer-sec">
        <h2 class="drawer-sec-title">メニュー</h2>
        <div id="drawerTabsSlot"></div>
      </div>
      <div class="drawer-sec">
        <div id="drawerActionsSlot"></div>
      </div>
    </div>
  </aside>

  <dialog id="loginScreen" class="editor login-dialog" aria-labelledby="loginTitle">
    <form id="loginForm" class="login-card" onsubmit="return false">
      <h1 id="loginTitle">管理者ログイン</h1>
      <p>管理操作にはパスキーが必要です。閲覧はログインなしで利用できます。</p>
      <button id="passkeyLogin" class="button secondary" type="button" style="margin-bottom:10px">パスキーでログイン</button>
      <button id="passkeyFirstRegister" class="button secondary" type="button" style="margin-bottom:14px" hidden>パスキーを登録（初回）</button>
      <div id="loginNotice" class="notice" role="status"></div>
      <button id="loginCancel" class="button ghost" type="button" style="margin-top:10px">閲覧に戻る</button>
    </form>
  </dialog>

  <main id="dashboard" class="shell" hidden>
    <div class="workspace">
      <aside class="sidebar" aria-label="機能ナビゲーション">
        <nav class="tabs" aria-label="登録内容の種類" role="tablist">
          <div class="nav-group" aria-hidden="true">辞書・メディア</div>
          <button id="soundTab" class="tab active" type="button" role="tab" aria-selected="true" aria-controls="soundPanel" data-tab="sound"><span class="tab-label">音声ファイル</span><span class="tab-count" id="soundTabCount"></span></button>
          <button id="overviewTab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="overviewPanel" data-tab="overview"><span class="tab-label">全体像</span></button>
          <button id="readingTab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="readingPanel" data-tab="reading"><span class="tab-label">特殊読み</span><span class="tab-count" id="readingTabCount"></span></button>
          <button id="gifTab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="gifPanel" data-tab="gif"><span class="tab-label">GIF</span><span class="tab-count" id="gifTabCount"></span></button>

          <div class="nav-group" aria-hidden="true">ボイス・音声処理</div>
          <button id="voiceTab" class="tab admin-only" type="button" role="tab" aria-selected="false" aria-controls="voicePanel" data-tab="voice"><span class="tab-label">話者クローン</span><span class="tab-count" id="voiceTabCount"></span></button>
          <button id="recorderTab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="recorderPanel" data-tab="recorder"><span class="tab-label">ボイスクローン</span></button>
          <button id="playgroundTab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="playgroundPanel" data-tab="playground"><span class="tab-label">実験場</span></button>
          <button id="requestsTab" class="tab admin-only" type="button" role="tab" aria-selected="false" aria-controls="requestsPanel" data-tab="requests"><span class="tab-label">登録申請</span><span class="tab-count" id="requestsTabCount"></span></button>
          <button id="listenTab" class="tab" type="button" role="tab" aria-selected="false" aria-controls="listenPanel" data-tab="listen"><span class="tab-label">聞き取り</span></button>
        </nav>
      </aside>

      <div class="workspace-main">
        <section class="metrics" aria-label="辞書の概要">
          <div class="metric"><div class="metric-icon" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none"><path d="M3 18v5M11 10v20M20 4v32M29 12v16M37 17v7" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg></div><div><div class="metric-label">特殊読み</div><div id="entryCount" class="metric-value">—</div></div></div>
          <div class="metric"><div class="metric-icon" aria-hidden="true"><svg viewBox="0 0 40 40" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 12h26m-7-6 7 6-7 6M33 28H7m7-6-7 6 7 6"/></svg></div><div><div class="metric-label">音声差し替え</div><div id="soundCount" class="metric-value">—</div></div></div>
          <div class="metric"><div class="metric-icon" aria-hidden="true"><svg viewBox="0 0 44 40"><text x="22" y="26" text-anchor="middle" fill="currentColor" font-size="18" font-family="system-ui" font-weight="700">GIF</text></svg></div><div><div class="metric-label">GIF</div><div id="gifCount" class="metric-value">—</div></div></div>
        </section>

        <section class="grid" id="soundPanel" role="tabpanel" aria-labelledby="soundTab"></section>
        <section id="overviewPanel" role="tabpanel" aria-labelledby="overviewTab" hidden></section>
        <section class="grid" id="readingPanel" role="tabpanel" aria-labelledby="readingTab" hidden></section>
        <section class="grid" id="gifPanel" role="tabpanel" aria-labelledby="gifTab" hidden></section>
        <section class="grid" id="voicePanel" role="tabpanel" aria-labelledby="voiceTab" hidden></section>
        <section id="recorderPanel" role="tabpanel" aria-labelledby="recorderTab" hidden></section>
        <section class="pg-layout" id="playgroundPanel" role="tabpanel" aria-labelledby="playgroundTab" hidden></section>
        <section id="requestsPanel" role="tabpanel" aria-labelledby="requestsTab" hidden></section>
        <section class="grid" id="listenPanel" role="tabpanel" aria-labelledby="listenTab" hidden></section>

        <div id="globalNotice" class="notice" role="status"></div>
      </div>
    </div>
  </main>

  <dialog id="entryEditor" class="editor" aria-labelledby="editorTitle">
    <form id="editorForm" class="editor-content">
      <h2 id="editorTitle">登録を編集</h2>
      <p id="editorDescription">登録語と内容を編集します。</p>
      <div class="field-group"><label class="field-label" for="editorTrigger">登録語句</label><input id="editorTrigger" class="field" maxlength="100" required></div>
      <div id="editorReadingGroup" class="field-group"><label class="field-label" for="editorReading">読み</label><input id="editorReading" class="field" maxlength="200"></div>
      <fieldset id="editorFilesGroup" class="field-group" hidden><legend class="field-label">再生する音声（1件以上）</legend><div id="editorFiles"></div><p class="inline-hint">チェックを外すとこの語句からは参照しません。ファイル本体は削除しません。</p></fieldset>
      <div id="editorNotice" class="notice" role="status"></div>
      <div class="editor-actions"><button id="editorCancel" class="button secondary" type="button">キャンセル</button><button class="button" type="submit">変更を保存</button></div>
    </form>
  </dialog>

  <script type="module" src="/static/core.js?v={{ASSET_V}}"></script>
</body>
</html>
