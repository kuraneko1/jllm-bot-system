[project]
name = "jllm-builtins"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "Pillow>=12.3,<13",
    "discord.py>=2.6,<3",
    "discord-ext-voice-recv>=0.5.2a179",
    "aiohttp>=3.9,<4",
    "jllm-tts-contract",
    "beautifulsoup4>=4.13,<5",
]

[tool.uv.sources]
jllm-tts-contract = { workspace = true }

[project.entry-points."jllm.plugins"]
"fake.provider" = "jllm_plugins.fake_provider:plugin.json"
"fake.router" = "jllm_plugins.fake_router:plugin.json"
"fake.consumer" = "jllm_plugins.fake_consumer:plugin.json"
"storage.local" = "jllm_plugins.storage:plugin.json"
"policy.restrictions" = "jllm_plugins.restrictions:plugin.json"
"adapter.discord" = "jllm_plugins.discord:plugin.json"
"feature.wavrank" = "jllm_plugins.wavrank:plugin.json"
"provider.tts.voicevox" = "jllm_plugins.tts_voicevox:plugin.json"
"tts.direct" = "jllm_plugins.tts_direct:plugin.json"
"provider.tts.openai" = "jllm_plugins.tts_openai:plugin.json"
"provider.tts.speechcpp" = "jllm_plugins.tts_speechcpp:plugin.json"
"provider.tts.irodori" = "jllm_plugins.tts_irodori:plugin.json"
"tts.router" = "jllm_plugins.tts_router:plugin.json"
"dictionary.sound" = "jllm_plugins.dictionaries:sound_plugin.json"
"dictionary.reading" = "jllm_plugins.dictionaries:reading_plugin.json"
"speech.effects" = "jllm_plugins.audio_effects:plugin.json"
"speech.playback" = "jllm_plugins.playback:plugin.json"
"voice.settings" = "jllm_plugins.voice_settings:plugin.json"
"speech.text" = "jllm_plugins.speech_text:plugin.json"
"feature.bookmarks" = "jllm_plugins.bookmarks:plugin.json"
"feature.reader" = "jllm_plugins.reader:plugin.json"
"dictionary.media" = "jllm_plugins.media:plugin.json"
"feature.html-library" = "jllm_plugins.html_library:plugin.json"
"tts.lifecycle" = "jllm_plugins.tts_lifecycle:plugin.json"
"ops.vram" = "jllm_plugins.vram_control:plugin.json"
"provider.llm.local" = "jllm_plugins.llm:provider_local.json"
"provider.llm.sarashina" = "jllm_plugins.llm:provider_sarashina.json"
"provider.llm.atmos" = "jllm_plugins.llm:provider_atmos.json"
"llm.router" = "jllm_plugins.llm:router.json"
"llm.controller" = "jllm_plugins.llm:controller.json"
"store.sessions" = "jllm_plugins.conversation:session_plugin.json"
"feature.kitasan" = "jllm_plugins.conversation:kitasan_plugin.json"
"web.safe-fetch" = "jllm_plugins.conversation:web_plugin.json"
"feature.conversation" = "jllm_plugins.conversation:conversation_plugin.json"
"feature.talk-log" = "jllm_plugins.conversation:talk_log_plugin.json"
"feature.translation" = "jllm_plugins.translation:plugin.json"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jllm_plugins"]
