[project]
name = "jllm-builtins"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "Pillow>=12.3,<13",
    "discord.py>=2.6,<3",
    "discord-ext-voice-recv>=0.5.2a179",
    "aiohttp>=3.9,<4",
    "jllm-tts-contract",
]

[tool.uv.sources]
jllm-tts-contract = { workspace = true }

[project.entry-points."jllm.plugins"]
"fake.provider" = "jllm_plugins.fake_provider:plugin.json"
"fake.router" = "jllm_plugins.fake_router:plugin.json"
"fake.consumer" = "jllm_plugins.fake_consumer:plugin.json"
"storage.local" = "jllm_plugins.storage:plugin.json"
"policy.restrictions" = "jllm_plugins.restrictions:plugin.json"
"adapter.discord" = "jllm_plugins.discord:plugin.json"
"feature.wavrank" = "jllm_plugins.wavrank:plugin.json"
"provider.tts.voicevox" = "jllm_plugins.tts_voicevox:plugin.json"
"tts.direct" = "jllm_plugins.tts_direct:plugin.json"
"provider.tts.openai" = "jllm_plugins.tts_openai:plugin.json"
"provider.tts.speechcpp" = "jllm_plugins.tts_speechcpp:plugin.json"
"provider.tts.irodori" = "jllm_plugins.tts_irodori:plugin.json"
"tts.router" = "jllm_plugins.tts_router:plugin.json"
"dictionary.sound" = "jllm_plugins.dictionaries:sound_plugin.json"
"dictionary.reading" = "jllm_plugins.dictionaries:reading_plugin.json"
"speech.effects" = "jllm_plugins.audio_effects:plugin.json"
"speech.playback" = "jllm_plugins.playback:plugin.json"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jllm_plugins"]
