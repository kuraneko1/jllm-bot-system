name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ffmpeg libpango-1.0-0 libpangoft2-1.0-0 libcairo2 fonts-noto-cjk
      - name: Sync dependencies
        run: uv sync --locked --all-packages
      - name: Lint
        run: uvx ruff check .
      - name: Tests
        run: uv run python -m unittest discover -s tests -q
      - name: Builtin plugin tests
        run: uv run python -m unittest discover -s plugins/builtins/tests -q
      - name: Repository hygiene
        run: uv run python tools/check-repository.py
