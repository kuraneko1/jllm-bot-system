name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"
      - name: Sync dependencies
        run: uv sync --locked --all-packages
      - name: Lint
        run: uvx ruff check .
      - name: Tests
        run: uv run python -m unittest discover -s tests -q
      - name: Builtin plugin tests
        run: uv run python -m unittest discover -s plugins/builtins/tests -q
      - name: Repository hygiene
        run: uv run python tools/check-repository.py
